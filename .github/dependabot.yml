# Автообновление зависимостей. Нативный механизм GitHub: без токенов.
version: 2
updates:
  # Образы в docker-compose.yml (сторонние сервисы)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Vladivostok"
    groups:
      containers-non-major:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  # Базовые образы в наших Dockerfile (FROM python:3.12-slim и т.п.)
  - package-ecosystem: "docker"
    directories:
      - "/enrichment"
      - "/fakeflac"
      - "/lidarr-provision"
      - "/prowlarr-provision"
      - "/beets"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Vladivostok"
    groups:
      base-images:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]

  # GitHub Actions (пины по SHA в workflow'ах обновляются с комментом версии)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Vladivostok"
    groups:
      actions:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
