name: build-images

# Собирает кастомные образы стека и пушит в GitHub Container Registry (GHCR).
# Сервер потом тянет готовые образы (docker compose pull) вместо локальной сборки.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "enrichment/**"
      - "fakeflac/**"
      - "lidarr-provision/**"
      - "prowlarr-provision/**"
      - "scripts/**"
      - ".github/workflows/build-images.yml"
  pull_request:
    paths:
      - "enrichment/**"
      - "fakeflac/**"
      - "lidarr-provision/**"
      - "prowlarr-provision/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - enrichment
          - fakeflac
          - lidarr-provision
          - prowlarr-provision
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        # На pull_request из форка пуш недоступен — только сборка
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pwnd-music-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "compose валиден"
